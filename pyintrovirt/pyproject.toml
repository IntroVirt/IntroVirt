[project]
name = "pyintrovirt"
version = "0.1.0"
description = "Python library and tools for IntroVirt VM introspection (requires IntroVirt runtime library and the generated IntroVirt Python wheel providing `introvirt`)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
ivsyscallmon_py = "pyintrovirt.tools.ivsyscallmon:main"
ivfilemon_py = "pyintrovirt.tools.ivfilemon:main"

[project.optional-dependencies]
dev = ["pylint", "ty", "ruff", "pytest"]
doc = ["sphinx", "furo"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
enable-by-default = false

[tool.hatch.build.targets.wheel]
packages = ["pyintrovirt"]
only-include-packages = ["pyintrovirt"]
ignore-vcs = true
artifacts = [
    "introvirt.py",
    "introvirt.pyi",
    "_introvirt_py*.so",
]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = [
    "pyintrovirt",
    "pyproject.toml",
    "README.md",
    "hatch_build.py",
    # Bundled SWIG artifacts so `uv build` (wheel-from-sdist) includes them
    "introvirt.py",
    "introvirt.pyi",
    "_introvirt_py*.so",
]

[tool.pylint.format]
max-line-length = 160

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_hypervisor: mark test as needing a live hypervisor (deselect with -m 'not requires_hypervisor')",
]
